<button class="collection-card-tile" type="button" [class.is-hit]="context.isHit(card)" [class.is-physically-unsorted]="showUnsortedState && card.physicalSorted === false" [attr.aria-label]="'Afficher les détails de ' + card.name" (click)="context.openCardDetails(card)">
  <span class="collection-card-art">@if (card.imageUrl || card.imageDataUrl) { <img [src]="card.imageUrl || card.imageDataUrl" alt="" loading="lazy" /> } @else { <span class="collection-card-placeholder"><svg lucideLayers [size]="23"></svg><small>{{ card.code || 'ONE PIECE' }}</small></span> }</span>
  @if (context.isHit(card)) { <svg class="hit-orbit" viewBox="0 0 70 100" preserveAspectRatio="none" aria-hidden="true"><rect class="orbit-forward" x="1" y="1" width="68" height="98" rx="3" pathLength="100" /><rect class="orbit-second" x="1" y="1" width="68" height="98" rx="3" pathLength="100" /></svg> }
  <span class="collection-top-badges"><span class="collection-condition-badge">{{ card.condition }}</span><strong class="collection-card-price">{{ context.formatPrice(card.marketPrice) }}</strong></span>@if (card.quantity > 1) { <span class="collection-quantity">×{{ card.quantity }}</span> }
  <span class="collection-card-meta"><span class="collection-card-title"><strong [class.hit-card-name]="context.isRedHit(card)" [class.hit-card-name-gold]="context.isGoldHit(card)">{{ card.name }}</strong><small class="collection-card-code">{{ card.code || 'Numéro à identifier' }}</small></span>@if (card.variant === 'Alternate art' || card.finish === 'Foil') {<span class="collection-card-tags">@if (card.variant === 'Alternate art') {<small class="collection-card-tag">Alternative</small>} @if (card.finish === 'Foil') {<small class="collection-card-tag foil">Foil</small>}</span>}</span>
</button>
